name: QuietWords
options:
  bundleIdPrefix: com.tavoohoh
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
packages:
  QuietWordsCore:
    path: Packages/QuietWordsCore
  QuietKit:
    path: ../QuietKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  QuietWords:
    type: application
    # iPhone and iPad; Apple silicon Macs run the iPad app ("Designed for iPad").
    supportedDestinations: [iOS]
    sources: [App]
    dependencies:
      - package: QuietWordsCore
      - package: QuietKit
        product: QuietCore
      - package: QuietKit
        product: QuietUI
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Daily reminder: the friends refresh (DailyReminders.friendsTaskID).
        BGTaskSchedulerPermittedIdentifiers: [com.tavoohoh.quietwords.friends]
        UIBackgroundModes: [fetch]
        # Same background and lockup as SplashView, in light and dark.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: SplashLockup
          UIImageRespectsSafeAreaInsets: false
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QW_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: $(QW_ENTITLEMENTS)
        PRODUCT_NAME: Quiet Words
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Quiet Words
        INFOPLIST_KEY_NSGKFriendListUsageDescription: Show your Game Center friends on Quiet Words leaderboards.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Gold
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
  QuietWordsAppTests:
    type: bundle.unit-test
    supportedDestinations: [iOS]
    sources: [AppTests]
    dependencies:
      - target: QuietWords
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tavoohoh.quietwords.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Quiet Words.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Quiet Words"
        BUNDLE_LOADER: "$(TEST_HOST)"
  QuietWordsUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [UITests]
    dependencies:
      - target: QuietWords
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tavoohoh.quietwords.uitests
schemes:
  QuietWords:
    build:
      targets:
        QuietWords: all
    test:
      targets:
        - package: QuietWordsCore/QuietWordsCoreTests
        - QuietWordsAppTests
        - QuietWordsUITests
