<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style></head><body>
<div style="width:1200px;height:800px;position:relative;overflow:hidden;background:var(--bg, linear-gradient(180deg, #16B4C4, #08788F));color:#FFFFFF;font-family:ui-rounded, 'SF Pro Rounded', Nunito, system-ui, sans-serif">

<div style="position:absolute;left:700px;top:200px;width:390px;height:600px;overflow:hidden">
